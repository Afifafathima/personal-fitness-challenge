<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Step 1</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">

  <!-- CONTAINER -->
  <div class="bg-white shadow-xl rounded-xl w-[400px] p-8">

    <!-- LOGO -->
    <div class="flex items-center gap-3 mb-6 justify-center">
      <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center shadow">
        <span class="text-white font-bold">💪</span>
      </div>
      <h1 class="text-lg font-semibold">FitChallenge</h1>
    </div>

    <!-- STEP -->
    <p class="text-sm text-gray-500 text-center mb-4">Step 1 of 3</p>

    <!-- TITLE -->
    <h2 class="text-xl font-bold text-center mb-6">Create Your Account</h2>

    <!-- FORM -->
    <div class="space-y-4">

      <!-- NAME -->
      <div>
        <label class="text-sm font-medium">Full Name</label>
        <input id="name" type="text"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500">
      </div>

      <!-- EMAIL -->
      <div>
        <label class="text-sm font-medium">Email Address</label>
        <input id="email" type="email"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500">
      </div>

      <!-- PASSWORD -->
      <div class="relative">
        <label class="text-sm font-medium">Password</label>

        <input id="password" type="password"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 pr-10">

        <span onclick="togglePassword('password', this)"
          class="absolute right-3 top-10 cursor-pointer text-gray-500">
          <i></i>
        </span>

        <p class="text-xs text-gray-400 mt-1">
          Minimum 6 characters
        </p>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="relative">
        <label class="text-sm font-medium">Confirm Password</label>

        <input id="confirmPassword" type="password"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 pr-10">

        <span onclick="togglePassword('confirmPassword', this)"
          class="absolute right-3 top-10 cursor-pointer text-gray-500">
          <i></i>
        </span>
      </div>

      <!-- TERMS -->
      <div class="flex items-center">
        <input id="terms" type="checkbox" class="mr-2">
        <label class="text-sm text-gray-600">
          I agree to the Terms & Conditions
        </label>
      </div>

    </div>

    <!-- BUTTON -->
    <button onclick="validateForm()"
      class="w-full mt-6 bg-emerald-500 text-white py-3 rounded-lg hover:bg-emerald-600 transition">
      Continue →
    </button>

    <!-- LOGIN -->
    <p class="text-center text-sm text-gray-500 mt-4">
      Already have an account?
      <a href="/login/" class="text-emerald-500 font-medium">Login</a>
    </p>

  </div>

  <!-- SCRIPT -->
  <script>
    // Set default icons (closed eye)
    window.onload = function () {
      document.querySelectorAll("span i").forEach(icon => {
        icon.innerHTML = feather.icons["eye-off"].toSvg();
      });
    };

    function togglePassword(id, el) {
      const input = document.getElementById(id);
      const icon = el.querySelector("i");

      if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = feather.icons["eye"].toSvg();
      } else {
        input.type = "password";
        icon.innerHTML = feather.icons["eye-off"].toSvg();
      }
    }

    function validateForm() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;
      const terms = document.getElementById("terms").checked;

      if (!name || !email) {
        alert("Please fill all fields!");
        return;
      }

      if (pass.length < 6) {
        alert("Password must be at least 6 characters!");
        return;
      }

      if (pass !== confirm) {
        alert("Passwords do not match!");
        return;
      }

      if (!terms) {
        alert("Please accept Terms & Conditions!");
        return;
      }

      // 🔥 STORE DATA
      sessionStorage.setItem("name", name);
      sessionStorage.setItem("email", email);
      sessionStorage.setItem("password", pass);

      // ✅ Django route
      window.location.href = "/signup2/";
    }
  </script>

</body>
</html>
