<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenge Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 left-0 w-full z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">💪</div>
      <h1 class="font-semibold text-sm md:text-base">
        Personal Fitness Challenge Web Platform
      </h1>
    </div>

    <div class="hidden md:flex gap-6 text-sm">
      <span onclick="goTo('help')" class="cursor-pointer">Help</span>
      <span onclick="goTo('profile')" class="cursor-pointer">Profile</span>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">
    <ul class="space-y-3 text-sm">
      <li onclick="goTo('dashboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Dashboard</li>
      <li onclick="goTo('challenges')" class="bg-emerald-500 p-2 rounded cursor-pointer">Challenges</li>
      <li onclick="goTo('trainers')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Trainers</li>
      <li onclick="goTo('calories')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Calories</li>
      <li onclick="goTo('leaderboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Leaderboard</li>
    </ul>
  </div>

  <!-- CONTENT -->
  <div class="flex-1">
    <div class="p-6 mt-16 md:ml-52">

      <div class="bg-white rounded-xl shadow max-w-2xl mx-auto overflow-hidden">

        <img id="img" class="w-full h-60 object-cover">

        <div class="p-6">
          <h2 id="title" class="text-2xl font-bold mb-2"></h2>
          <p id="days" class="text-gray-500 mb-4"></p>
          <p id="desc" class="text-gray-600 mb-6"></p>

          <button id="joinBtn" onclick="toggleJoin()" 
          class="bg-emerald-500 text-white px-6 py-2 rounded">
            Join Challenge
          </button>

          <button onclick="reportChallenge()" 
          class="ml-4 bg-red-500 text-white px-4 py-2 rounded">
            Report
          </button>

        </div>

      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

  <!-- SCRIPT -->
  <script>

    function goTo(page){
      window.location.href = page + ".html";
    }

    const id = new URLSearchParams(window.location.search).get("id");

    let challenges = JSON.parse(localStorage.getItem("allChallenges")) || [];
    let joined = JSON.parse(localStorage.getItem("joinedChallenges")) || [];

    const data = challenges.find(c => String(c.id) === String(id));

    // 🚨 HANDLE NOT FOUND
    if (!data) {
      document.getElementById("title").innerText = "Challenge not found";
      document.getElementById("joinBtn").style.display = "none";
    } else {
      document.getElementById("title").innerText = data.name;
      document.getElementById("days").innerText = data.days;
      document.getElementById("img").src = data.img;
      document.getElementById("desc").innerText = data.desc || "No description available";
    }

    function updateButton() {
      if (!data) return;

      const btn = document.getElementById("joinBtn");

      if (joined.includes(data.id)) {
        btn.innerText = "Joined";
        btn.classList.replace("bg-emerald-500", "bg-gray-500");
      } else {
        btn.innerText = "Join Challenge";
        btn.classList.replace("bg-gray-500", "bg-emerald-500");
      }
    }

    function toggleJoin() {
      if (!data) return;

      const index = joined.indexOf(data.id);

      if (index === -1) {
        joined.push(data.id);
      } else {
        joined.splice(index, 1);
      }

      localStorage.setItem("joinedChallenges", JSON.stringify(joined));
      updateButton();
    }

    updateButton();

    // ✅ FIXED REPORT FUNCTION
    function reportChallenge(){

      if (!data) {
        alert("Challenge not found");
        return;
      }

      const reason = prompt("Enter reason for reporting this challenge:");

      if(!reason || reason.trim() === ""){
        alert("Please enter a valid reason");
        return;
      }

      let reports = JSON.parse(localStorage.getItem("reports")) || [];

      reports.push({
        id: Date.now(),
        challengeId: data.id,
        challengeName: data.name,
        reason: reason,
        img: data.img,
        days: data.days,
        desc: data.desc
      });

      localStorage.setItem("reports", JSON.stringify(reports));

      alert("Report submitted successfully!");
    }

  </script>

</body>
</html>
