<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Challenges</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">

    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">💪</div>
      <h1 class="text-sm md:text-base font-semibold">Personal Fitness Challenge Web Platform</h1>
    </div>

    <div class="flex gap-6 text-sm">
      <span onclick="goTo('help')" class="cursor-pointer hover:text-emerald-400">Help</span>
      <span onclick="goTo('profile')" class="cursor-pointer hover:text-emerald-400">Profile</span>
    </div>

  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">

    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Dashboard
      </li>

      <li class="bg-emerald-500 p-2 rounded cursor-pointer">
        Challenges
      </li>

      <li onclick="goTo('create-challenge')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Create Challenge
      </li>

      <li onclick="goTo('leaderboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Leaderboard
      </li>

    </ul>

  </div>

  <!-- CONTENT -->
  <div class="flex-1">
    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <h2 class="text-xl md:text-2xl font-bold mb-6">My Challenges</h2>

      <div id="challengeContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

  <!-- SCRIPT -->
<script>

function goTo(page){
  window.location.href = page + ".html";
}

// ✅ DEFAULT DATA
const defaultChallenges = [
  {
    id: 1,
    name: "Abs Challenge",
    days: "7 Days",
    img: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?q=80&w=800"
  },
  {
    id: 2,
    name: "Full Body Workout",
    days: "14 Days",
    img: "https://images.unsplash.com/photo-1558611848-73f7eb4001a1?q=80&w=800"
  }
];

// ✅ USE allChallenges (SHARED)
function getChallenges(){
  let data = JSON.parse(localStorage.getItem("allChallenges"));

  if(!data || data.length === 0){
    data = defaultChallenges;
    localStorage.setItem("allChallenges", JSON.stringify(data));
  }

  return data;
}

function saveChallenges(data){
  localStorage.setItem("allChallenges", JSON.stringify(data));
}

function deleteChallenge(id){
  if(!confirm("Delete this challenge?")) return;

  let data = getChallenges();
  data = data.filter(c => c.id !== id);
  saveChallenges(data);
  loadChallenges();
}

// ENABLE EDIT
function enableEdit(id){
  document.getElementById("name-"+id).disabled = false;
  document.getElementById("days-"+id).disabled = false;

  document.getElementById("edit-"+id).classList.add("hidden");
  document.getElementById("save-"+id).classList.remove("hidden");
}

// SAVE EDIT
function saveEdit(id){
  let data = getChallenges();

  const updatedName = document.getElementById("name-"+id).value;
  const updatedDays = document.getElementById("days-"+id).value;

  const ch = data.find(c => c.id === id);
  ch.name = updatedName;
  ch.days = updatedDays;

  saveChallenges(data);
  loadChallenges();
}

function loadChallenges(){
  const container = document.getElementById("challengeContainer");
  const data = getChallenges();

  container.innerHTML = "";

  data.forEach(ch => {

    const card = document.createElement("div");

    card.className = "bg-white rounded-xl shadow overflow-hidden p-4";

    card.innerHTML = `
      <img src="${ch.img}" class="h-40 w-full object-cover rounded">

      <div class="mt-4">

        <input id="name-${ch.id}" value="${ch.name}" disabled
        class="font-semibold w-full mb-2 bg-gray-100 p-1 rounded">

        <input id="days-${ch.id}" value="${ch.days}" disabled
        class="text-sm text-gray-500 w-full mb-4 bg-gray-100 p-1 rounded">

        <div class="flex justify-between">

          <button id="edit-${ch.id}" onclick="enableEdit(${ch.id})"
          class="text-blue-500 text-sm">
            Edit
          </button>

          <button id="save-${ch.id}" onclick="saveEdit(${ch.id})"
          class="text-green-500 text-sm hidden">
            Save
          </button>

          <button onclick="deleteChallenge(${ch.id})"
          class="text-red-500 text-sm">
            Delete
          </button>

        </div>

      </div>
    `;

    container.appendChild(card);
  });
}

loadChallenges();

</script>

</body>
</html>
