<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">💪</div>
      <h1 class="text-sm md:text-base font-semibold">
        Personal Fitness Challenge Web Platform
      </h1>
    </div>

    <div class="flex gap-6 text-sm">
      <span onclick="goTo('help')" class="cursor-pointer hover:text-emerald-400">Help</span>
      <span onclick="goTo('profile')" class="cursor-pointer hover:text-emerald-400">Profile</span>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">
    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Dashboard</li>
      <li onclick="goTo('manage-challenges')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Manage Challenges</li>
      <li class="bg-emerald-500 p-2 rounded cursor-pointer">Reports</li>
      <li onclick="goTo('certificate')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Certificate</li>

    </ul>
  </div>

  <!-- CONTENT -->
  <div class="flex-1">
    <div class="p-6 mt-16 md:ml-52">

      <h2 class="text-2xl font-bold mb-6">Reported Challenges</h2>

      <div id="reportContainer" class="space-y-4"></div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

  <!-- SCRIPT -->
  <script>

    function goTo(page){
      window.location.href = page + ".html";
    }

    function loadReports(){

      const container = document.getElementById("reportContainer");
      let reports = JSON.parse(localStorage.getItem("reports")) || [];
      let challenges = JSON.parse(localStorage.getItem("allChallenges")) || [];

      container.innerHTML = "";

      if(reports.length === 0){
        container.innerHTML = "<p class='text-gray-500'>No reports available</p>";
        return;
      }

      reports.forEach((report, index) => {

        const div = document.createElement("div");

        div.className = "bg-white p-4 rounded-xl shadow";

        div.innerHTML = `
          <div class="flex gap-4 items-center">

            <img src="${report.img}" class="w-20 h-20 object-cover rounded">

            <div class="flex-1">
              <h3 class="font-semibold">${report.challengeName}</h3>
              <p class="text-sm text-gray-500">${report.days}</p>
              <p class="text-sm text-red-500 mt-1">Reason: ${report.reason}</p>
            </div>

            <div class="flex flex-col gap-2">
              <button onclick="deleteChallenge(${index})"
              class="bg-red-500 text-white px-3 py-1 rounded text-sm">
                Delete
              </button>

              <button onclick="ignoreReport(${index})"
              class="bg-gray-500 text-white px-3 py-1 rounded text-sm">
                Ignore
              </button>
            </div>

          </div>
        `;

        container.appendChild(div);
      });

    }

    function deleteChallenge(index){

      let reports = JSON.parse(localStorage.getItem("reports")) || [];
      let challenges = JSON.parse(localStorage.getItem("allChallenges")) || [];

      const report = reports[index];

      // remove challenge globally
      challenges = challenges.filter(c => c.id != report.challengeId);
      localStorage.setItem("allChallenges", JSON.stringify(challenges));

      // remove report
      reports.splice(index, 1);
      localStorage.setItem("reports", JSON.stringify(reports));

      alert("Challenge deleted");
      loadReports();
    }

    function ignoreReport(index){

      let reports = JSON.parse(localStorage.getItem("reports")) || [];

      reports.splice(index, 1);
      localStorage.setItem("reports", JSON.stringify(reports));

      alert("Report ignored");
      loadReports();
    }

    loadReports();

  </script>

</body>
</html>
