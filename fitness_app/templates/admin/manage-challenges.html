<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Challenges</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">💪</div>
      <h1 class="text-sm md:text-base font-semibold">
        Personal Fitness Challenge Web Platform
      </h1>
    </div>


  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">
    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Dashboard
      </li>

      <li class="bg-emerald-500 p-2 rounded cursor-pointer">
        Manage Challenges
      </li>

      <li onclick="goTo('reports')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Reports
      </li>

      <li onclick="goTo('certificate')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Certificate
      </li>

    </ul>
  </div>

  <!-- CONTENT -->
  <div class="flex-1">
    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <h2 class="text-xl md:text-2xl font-bold mb-6">Manage Challenges</h2>

      <div id="challengeContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

  <!-- SCRIPT -->
<script>

function goTo(page){
  window.location.href = "/admin/" + page + "/";
}

async function deleteChallenge(id){

  if(!confirm("Delete this challenge?")){
    return;
  }

  const response =
    await fetch(`/api/delete-challenge/${id}/`);

  const data =
    await response.json();

  if(data.success){

    alert("Challenge deleted");

    loadChallenges();

  } else {

    alert("Failed to delete");
  }
}

async function loadChallenges(){

  const container =
    document.getElementById("challengeContainer");

  container.innerHTML = "Loading...";

  const response =
    await fetch("/api/challenges/");

  const data =
    await response.json();

  container.innerHTML = "";

  if(data.length === 0){

    container.innerHTML = `
      <p class='text-gray-500'>
        No challenges available
      </p>
    `;

    return;
  }

  data.forEach(ch => {

    const div =
      document.createElement("div");

    div.className =
      "bg-white rounded-xl shadow p-4";

    div.innerHTML = `
      <img src="${ch.image}"
      class="h-40 w-full object-cover rounded">

      <h3 class="font-semibold mt-3">
        ${ch.name}
      </h3>

      <p class="text-sm text-gray-500">
        ${ch.days}
      </p>

      <p class="text-xs text-emerald-500 mb-3">
        Trainer: ${ch.trainer}
      </p>

      <button
      onclick="deleteChallenge(${ch.id})"
      class="bg-red-500 text-white px-4 py-2 rounded text-sm">

        Delete

      </button>
    `;

    container.appendChild(div);
  });
}

loadChallenges();


</script>

</body>
</html>
