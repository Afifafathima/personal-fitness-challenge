<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Certificates</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">

    <div class="flex items-center gap-3">

      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
        💪
      </div>

      <h1 class="text-sm md:text-base font-semibold">
        Personal Fitness Challenge Web Platform
      </h1>

    </div>

  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">

    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Dashboard
      </li>

      <li onclick="goTo('manage-challenges')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Manage Challenges
      </li>

      <li onclick="goTo('reports')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Reports
      </li>

      <li class="bg-emerald-500 p-2 rounded cursor-pointer">
        Certificate
      </li>

    </ul>

  </div>

  <!-- CONTENT -->
  <div class="flex-1">

    <div class="p-6 mt-16 md:ml-52">

      <h2 class="text-2xl font-bold mb-6">
        Trainer Certificate Verification
      </h2>

      <!-- FILTER CARDS -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">

        <div
        onclick="filterStatus('approved', this)"
        class="filterCard bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-lg transition">

          <p class="text-gray-500 text-sm">
            ✅ Accepted
          </p>

          <h3 id="acceptedCount"
          class="text-2xl font-bold mt-2">
            0
          </h3>

        </div>

        <div
        onclick="filterStatus('rejected', this)"
        class="filterCard bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-lg transition">

          <p class="text-gray-500 text-sm">
            ❌ Rejected
          </p>

          <h3 id="rejectedCount"
          class="text-2xl font-bold mt-2">
            0
          </h3>

        </div>

        <div
        onclick="filterStatus('pending', this)"
        class="filterCard bg-emerald-500 text-white p-4 rounded-xl shadow cursor-pointer hover:shadow-lg transition">

          <p class="text-sm">
            ⏳ Pending
          </p>

          <h3 id="pendingCount"
          class="text-2xl font-bold mt-2">
            0
          </h3>

        </div>

      </div>

      <!-- TRAINERS -->
      <div id="trainerContainer"
      class="space-y-4">
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

  <!-- CERTIFICATE MODAL -->
  <div id="modal"
  class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

    <div class="bg-white rounded-xl p-6 max-w-2xl w-full relative">

      <button
      onclick="closeModal()"
      class="absolute top-4 right-4 text-gray-500 text-xl">

        ✕

      </button>

      <h2 class="text-xl font-bold mb-4">
        Trainer Certificate
      </h2>

      <img id="modalImage"
      class="w-full h-[400px] object-contain border rounded">

      <div id="modalButtons"
      class="flex gap-4 mt-6">
      </div>

    </div>

  </div>

<script>

function goTo(page){
  window.location.href =
    "/admin/" + page + "/";
}

let allTrainers = [];
let currentFilter = "pending";

// APPROVE
async function approve(id){

  const response =
    await fetch(`/api/approve-trainer/${id}/`);

  const data =
    await response.json();

  if(data.success){

    alert("Trainer approved");

    closeModal();

    loadTrainers();

  } else {

    alert("Failed");
  }
}

// REJECT
async function reject(id){

  const response =
    await fetch(`/api/reject-trainer/${id}/`);

  const data =
    await response.json();

  if(data.success){

    alert(
      "Trainer rejected. Trainer can reapply again."
    );

    closeModal();

    loadTrainers();

  } else {

    alert("Failed");
  }
}

// FILTER
function filterStatus(status, card){

  currentFilter = status;

  document.querySelectorAll(
    ".filterCard"
  ).forEach(c => {

    c.classList.remove(
      "bg-emerald-500",
      "text-white"
    );

    c.classList.add(
      "bg-white"
    );
  });

  card.classList.remove(
    "bg-white"
  );

  card.classList.add(
    "bg-emerald-500",
    "text-white"
  );

  renderFiltered();
}

// RENDER FILTERED
function renderFiltered(){

  const container =
    document.getElementById(
      "trainerContainer"
    );

  container.innerHTML = "";

  const filtered =
    allTrainers.filter(
      t => t.status === currentFilter
    );

  if(filtered.length === 0){

    container.innerHTML = `
      <p class="text-gray-500">
        No applications found
      </p>
    `;

    return;
  }

  filtered.forEach(t => {

    const div =
      document.createElement("div");

    div.className =
      "bg-white p-4 rounded-xl shadow";

    let statusColor =
      "text-yellow-500";

    if(t.status === "approved"){
      statusColor = "text-green-500";
    }

    if(t.status === "rejected"){
      statusColor = "text-red-500";
    }

    div.innerHTML = `

      <div class="flex gap-4 items-center">

        <img src="${t.certificate}"
        class="w-28 h-28 object-cover rounded border">

        <div class="flex-1">

          <h3 class="font-semibold text-lg">
            ${t.name}
          </h3>

          <p class="${statusColor} text-sm mt-1 capitalize">
            Status: ${t.status}
          </p>

        </div>

        <button
        onclick="viewCertificate(
          '${t.certificate}',
          '${t.status}',
          ${t.id}
        )"
        class="bg-blue-500 text-white px-4 py-2 rounded text-sm">

          View Certificate

        </button>

      </div>
    `;

    container.appendChild(div);
  });
}

// VIEW CERTIFICATE
function viewCertificate(image, status, id){

  document.getElementById(
    "modal"
  ).classList.remove("hidden");

  document.getElementById(
    "modal"
  ).classList.add("flex");

  document.getElementById(
    "modalImage"
  ).src = image;

  const buttons =
    document.getElementById(
      "modalButtons"
    );

  if(status === "pending"){

    buttons.innerHTML = `

      <button
      onclick="approve(${id})"
      class="bg-green-500 text-white px-6 py-2 rounded">

        Accept

      </button>

      <button
      onclick="reject(${id})"
      class="bg-red-500 text-white px-6 py-2 rounded">

        Reject

      </button>
    `;

  } else {

    buttons.innerHTML = `
      <p class="text-gray-500">
        Verification completed
      </p>
    `;
  }
}

// CLOSE MODAL
function closeModal(){

  document.getElementById(
    "modal"
  ).classList.add("hidden");

  document.getElementById(
    "modal"
  ).classList.remove("flex");
}

// LOAD TRAINERS
async function loadTrainers(){

  const response =
    await fetch(
      "/api/trainer-requests/"
    );

  const data =
    await response.json();

  allTrainers = data.trainers;

  // COUNTS
  document.getElementById(
    "acceptedCount"
  ).innerText =
    data.accepted;

  document.getElementById(
    "rejectedCount"
  ).innerText =
    data.rejected;

  document.getElementById(
    "pendingCount"
  ).innerText =
    data.pending;

  renderFiltered();
}

loadTrainers();

</script>

</body>
</html>
