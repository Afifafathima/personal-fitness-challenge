<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">💪</div>
      <h1 class="text-sm md:text-base font-semibold">
        Personal Fitness Challenge Web Platform
      </h1>
    </div>

    <div class="hidden md:flex gap-6 text-sm">
      <span onclick="goTo('help')" class="cursor-pointer">Help</span>
      <span onclick="goTo('profile')" class="cursor-pointer">Profile</span>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">
    <ul class="space-y-3 text-sm">
      <li onclick="goTo('dashboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Dashboard</li>
      <li onclick="goTo('challenges')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Challenges</li>
      <li onclick="goTo('trainers')" class="bg-emerald-500 p-2 rounded cursor-pointer">Trainers</li>
      <li onclick="goTo('calories')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Calories</li>
      <li onclick="goTo('leaderboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Leaderboard</li>
    </ul>
  </div>

  <!-- CONTENT -->
  <div class="flex-1">
    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <div class="bg-white rounded-xl shadow max-w-3xl mx-auto p-6 text-center">

        <!-- IMAGE -->
        <img id="img" class="w-32 h-32 mx-auto rounded-full object-cover mb-4">

        <!-- INFO -->
        <h2 id="name" class="text-2xl font-bold mb-2"></h2>
        <p id="role" class="text-gray-500 mb-2"></p>
        <p id="rating" class="text-yellow-500 mb-4"></p>

        <p id="desc" class="text-gray-600 mb-4"></p>

        <!-- EXTRA INFO -->
        <p id="experience" class="text-sm text-gray-500 mb-6"></p>

        <!-- CHALLENGES -->
        <h3 class="text-lg font-semibold mb-3">Challenges by Trainer</h3>

        <div id="challengeList" class="space-y-3"></div>

      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

  <!-- SCRIPT -->
  <script>

function goTo(page){

  window.location.href =
    "/user/" + page + "/";
}

function openChallenge(id){

  window.location.href =
    "/user/challenge-detail/?id=" + id;
}

async function loadTrainer(){

  const id =
    new URLSearchParams(
      window.location.search
    ).get("id");

  const response =
    await fetch(
      "/api/trainer-detail/" + id + "/"
    );

  const data =
    await response.json();

  document.getElementById(
    "name"
  ).innerText =
    data.name;

  document.getElementById(
    "role"
  ).innerText =
    data.specialization ||
    "Fitness Trainer";

  document.getElementById(
    "img"
  ).src =
    data.image;

  document.getElementById(
    "desc"
  ).innerText =
    "Professional fitness trainer.";

  document.getElementById(
    "experience"
  ).innerText =
    "Experience: " +
    (data.experience || "N/A");

  const container =
    document.getElementById(
      "challengeList"
    );

  container.innerHTML = "";

  data.challenges.forEach(ch => {

    container.innerHTML += `

      <div
      onclick="openChallenge(${ch.id})"
      class="p-3 bg-gray-100 rounded cursor-pointer hover:bg-gray-200">

        ${ch.name}

      </div>
    `;
  });
}

loadTrainer();

</script>

</body>
</html>
