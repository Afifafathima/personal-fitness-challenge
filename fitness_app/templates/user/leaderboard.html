<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 left-0 w-full z-50">

    <div class="flex items-center gap-3">

      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
        💪
      </div>

      <h1 class="font-semibold text-sm md:text-base">

        Personal Fitness Challenge Web Platform

      </h1>

    </div>

    <div class="hidden md:flex gap-6 text-sm">

      <span onclick="goTo('help')"
      class="cursor-pointer hover:text-emerald-400">

        Help

      </span>

      <span onclick="goTo('profile')"
      class="cursor-pointer hover:text-emerald-400">

        Profile

      </span>

    </div>

  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">

    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">

        Dashboard

      </li>

      <li onclick="goTo('challenges')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">

        Challenges

      </li>

      <li onclick="goTo('trainers')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">

        Trainers

      </li>

      <li onclick="goTo('calories')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">

        Calories

      </li>

      <li class="bg-emerald-500 p-2 rounded cursor-pointer">

        Leaderboard

      </li>

    </ul>

  </div>

  <!-- CONTENT -->
  <div class="flex-1">

    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <h2 class="text-xl md:text-2xl font-bold mb-6">

        User Leaderboard

      </h2>

      <div class="bg-white rounded-xl shadow overflow-hidden">

        <table class="w-full text-left">

          <thead class="bg-gray-200 text-gray-700 text-sm">

            <tr>

              <th class="p-4">
                Rank
              </th>

              <th class="p-4">
                User
              </th>

              <th class="p-4">
                Current Streak
              </th>

              <th class="p-4">
                Longest Streak
              </th>

              <th class="p-4">
                Joined Challenges
              </th>

            </tr>

          </thead>

          <tbody id="leaderboardBody"
          class="text-sm text-gray-600">

          </tbody>

        </table>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">

    © 2026 Personal Fitness Challenge Web Platform

  </footer>

<script>

function goTo(page){

  window.location.href =
    "/user/" + page + "/";
}

async function loadLeaderboard(){

  const tbody =
    document.getElementById(
      "leaderboardBody"
    );

  tbody.innerHTML = `
    <tr>
      <td colspan="5"
      class="p-4">

        Loading...

      </td>
    </tr>
  `;

  try{

    const response =
      await fetch(
        "/api/user-leaderboard/"
      );

    const data =
      await response.json();

    tbody.innerHTML = "";

    if(data.length === 0){

      tbody.innerHTML = `
        <tr>

          <td colspan="5"
          class="p-4 text-center text-gray-500">

            No users found

          </td>

        </tr>
      `;

      return;
    }

    data.forEach((user, index) => {

      const tr =
        document.createElement("tr");

      tr.innerHTML = `

        <td class="p-4 font-bold">

          #${index + 1}

        </td>

        <td class="p-4">

          ${user.name}

        </td>

        <td class="p-4 text-emerald-500 font-semibold">

          🔥 ${user.streak}

        </td>

        <td class="p-4">

          ${user.longest}

        </td>

        <td class="p-4">

          ${user.joined}

        </td>
      `;

      tbody.appendChild(tr);
    });

  } catch(error){

    tbody.innerHTML = `
      <tr>

        <td colspan="5"
        class="p-4 text-red-500">

          Failed to load leaderboard

        </td>

      </tr>
    `;
  }
}

loadLeaderboard();

</script>

</body>
</html>
