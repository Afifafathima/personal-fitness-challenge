<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenges</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 left-0 w-full z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">💪</div>
      <h1 class="font-semibold text-sm md:text-base">
        Personal Fitness Challenge Web Platform
      </h1>
    </div>

    <div class="hidden md:flex gap-6 text-sm">
      <span onclick="goTo('help')" class="cursor-pointer hover:text-emerald-400">Help</span>
      <span onclick="goTo('profile')" class="cursor-pointer hover:text-emerald-400">Profile</span>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">
    <ul class="space-y-3 text-sm">
      <li onclick="goTo('dashboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Dashboard</li>
      <li class="bg-emerald-500 p-2 rounded cursor-pointer">Challenges</li>
      <li onclick="goTo('trainers')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Trainers</li>
      <li onclick="goTo('calories')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Calories</li>
      <li onclick="goTo('leaderboard')" class="hover:bg-gray-700 p-2 rounded cursor-pointer">Leaderboard</li>
    </ul>
  </div>

  <!-- CONTENT -->
  <div class="flex-1">
    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <h2 class="text-xl md:text-2xl font-bold mb-6">Challenges</h2>

      <!-- TABS -->
      <div class="flex flex-wrap gap-4 mb-6">

  <button onclick="filterChallenges('all', this)"
  class="tab-btn bg-emerald-500 text-white px-4 py-2 rounded">

    All

  </button>

  <button onclick="filterChallenges('Strength', this)"
  class="tab-btn bg-white text-gray-700 px-4 py-2 rounded shadow">

    Strength

  </button>

  <button onclick="filterChallenges('Cardio', this)"
  class="tab-btn bg-white text-gray-700 px-4 py-2 rounded shadow">

    Cardio

  </button>

  <button onclick="filterChallenges('Yoga', this)"
  class="tab-btn bg-white text-gray-700 px-4 py-2 rounded shadow">

    Yoga

  </button>

  <button onclick="filterChallenges('HIIT', this)"
  class="tab-btn bg-white text-gray-700 px-4 py-2 rounded shadow">

    HIIT

  </button>

  <button onclick="filterChallenges('Weight Loss', this)"
  class="tab-btn bg-white text-gray-700 px-4 py-2 rounded shadow">

    Weight Loss

  </button>

</div>

      <!-- CARDS -->
      <div id="challengeContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white w-full">
    <div class="max-w-7xl mx-auto px-6 py-6 text-center text-gray-400 text-xs">
      © 2026 Personal Fitness Challenge Web Platform
    </div>
  </footer>

  <!-- SCRIPT -->
<script>

function goTo(page) {
  window.location.href = "/user/" + page + "/";
}

function openChallenge(id) {
  window.location.href = "/user/challenge-detail/?id=" + id;
}

async function loadChallenges(){

  const container = document.getElementById("challengeContainer");

  container.innerHTML = "Loading...";

  const response = await fetch("/api/challenges/");
  const data = await response.json();

  container.innerHTML = "";

  if(data.length === 0){
    container.innerHTML = `
      <p class='text-gray-500'>
        No challenges available
      </p>
    `;
    return;
  }

  data.forEach((ch, index) => {


    const div = document.createElement("div");

    div.className =
      "challenge bg-white rounded-xl shadow overflow-hidden cursor-pointer";

    div.setAttribute("data-type", ch.category);

    div.onclick = () => openChallenge(ch.id);

    div.innerHTML = `
      <img src="${ch.image}"
      class="h-40 w-full object-cover">

      <div class="p-4">

        <h3 class="font-semibold">
          ${ch.name}
        </h3>

        <p class="text-sm text-gray-500">
          ${ch.days}
        </p>

        <p class="text-xs text-emerald-500 mt-2">
          Trainer: ${ch.trainer}
        </p>

        <p class="text-xs text-blue-500 mb-2">
  ${ch.category}
  
</p>

      </div>
    `;

    container.appendChild(div);
  });

  window.allCards =
  document.querySelectorAll(".challenge");
}

function filterChallenges(type, btn) {

  const cards = document.querySelectorAll(".challenge");

  const buttons =
    document.querySelectorAll(".tab-btn");

  cards.forEach(card => {

    const category =
      card.getAttribute("data-type");

    if(type === "all" || category === type){

      card.style.display = "block";

    } else {

      card.style.display = "none";
    }
  });

  buttons.forEach(b => {

    b.classList.remove(
      "bg-emerald-500",
      "text-white"
    );

    b.classList.add(
      "bg-white",
      "text-gray-700"
    );
  });

  btn.classList.remove(
    "bg-white",
    "text-gray-700"
  );

  btn.classList.add(
    "bg-emerald-500",
    "text-white"
  );
}

loadChallenges();


</script>

</body>
</html>
