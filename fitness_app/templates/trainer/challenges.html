<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Challenges</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">

    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
        💪
      </div>

      <h1 class="text-sm md:text-base font-semibold">
        Personal Fitness Challenge Web Platform
      </h1>
    </div>

    <div class="flex gap-6 text-sm">
      <span onclick="goTo('help')"
      class="cursor-pointer hover:text-emerald-400">
        Help
      </span>

      <span onclick="goTo('profile')"
      class="cursor-pointer hover:text-emerald-400">
        Profile
      </span>
    </div>

  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">

    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Dashboard
      </li>

      <li class="bg-emerald-500 p-2 rounded cursor-pointer">
        Challenges
      </li>

      <li onclick="goTo('create-challenge')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Create Challenge
      </li>

      <li onclick="goTo('leaderboard')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Leaderboard
      </li>

    </ul>

  </div>

  <!-- CONTENT -->
  <div class="flex-1">

    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <h2 class="text-xl md:text-2xl font-bold mb-6">
        My Challenges
      </h2>

      <div id="challengeContainer"
      class="grid grid-cols-1 md:grid-cols-3 gap-6">
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

<script>

function goTo(page){
  window.location.href =
    "/trainer/" + page + "/";
}

async function deleteChallenge(id, event){

  event.stopPropagation();

  if(!confirm("Delete this challenge?")){
    return;
  }

  const response =
    await fetch(`/api/delete-challenge/${id}/`);

  const data =
    await response.json();

  if(data.success){

    alert("Challenge deleted");

    loadChallenges();

  } else {

    alert("Failed");
  }
}

async function editChallenge(id, event){

  event.stopPropagation();

  const name =
    prompt("Enter new challenge name");

  if(!name){
    return;
  }

  const days =
    prompt("Enter duration");

  if(!days){
    return;
  }

  const category =
    prompt("Enter category");

  if(!category){
    return;
  }

  const formData =
    new FormData();

  formData.append("name", name);
  formData.append("days", days);
  formData.append("category", category);

  const response =
    await fetch(`/api/edit-challenge/${id}/`, {

      method: "POST",

      body: formData,

      headers: {
        "X-CSRFToken":
        getCookie("csrftoken")
      }
    });

  const data =
    await response.json();

  if(data.success){

    alert("Challenge updated");

    loadChallenges();

  } else {

    alert("Update failed");
  }
}

async function loadChallenges(){

  const container =
    document.getElementById(
      "challengeContainer"
    );

  container.innerHTML =
    "Loading...";

  const response =
    await fetch(
      "/api/trainer-challenges/"
    );

  const data =
    await response.json();

  container.innerHTML = "";

  if(data.length === 0){

    container.innerHTML = `
      <p class='text-gray-500'>
        No challenges created
      </p>
    `;

    return;
  }

  data.forEach(ch => {

    const card =
      document.createElement("div");

    card.className =
      "bg-white rounded-xl shadow overflow-hidden p-4 cursor-pointer hover:shadow-lg transition";

    // OPEN DETAIL PAGE
    card.onclick = () => {

      window.location.href =
      `/trainer/challenge-detail/?id=${ch.id}`;
    };

    card.innerHTML = `

      <img src="${ch.image}"
      class="h-40 w-full object-cover rounded">

      <div class="mt-4">

        <h3 class="font-semibold">
          ${ch.name}
        </h3>

        <p class="text-sm text-gray-500">
          ${ch.days}
        </p>

        <p class="text-xs text-blue-500 mt-1">
          ${ch.category}
        </p>

        <p class="text-xs text-emerald-500 mt-1">
          Joined Users: ${ch.joined}
        </p>

        <div class="flex gap-2 mt-4">

          <button
          onclick="editChallenge(${ch.id}, event)"
          class="bg-blue-500 text-white px-3 py-1 rounded text-sm">

            Edit

          </button>

          <button
          onclick="deleteChallenge(${ch.id}, event)"
          class="bg-red-500 text-white px-3 py-1 rounded text-sm">

            Delete

          </button>

        </div>

      </div>
    `;

    container.appendChild(card);
  });
}

// CSRF
function getCookie(name){

  let cookieValue = null;

  if(document.cookie &&
    document.cookie !== ''){

    const cookies =
      document.cookie.split(';');

    for(let i = 0;
      i < cookies.length;
      i++){

      const cookie =
        cookies[i].trim();

      if(cookie.substring(
        0,
        name.length + 1
      ) === (name + '=')){

        cookieValue =
          decodeURIComponent(
            cookie.substring(
              name.length + 1
            )
          );

        break;
      }
    }
  }

  return cookieValue;
}

loadChallenges();

</script>

</body>
</html>
