<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">

    <div class="flex items-center gap-3">

      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
        💪
      </div>

      <h1 class="text-sm md:text-base font-semibold">
        Personal Fitness Challenge Web Platform
      </h1>

    </div>

    <div class="flex gap-6 text-sm">

      <span onclick="goTo('help')"
      class="cursor-pointer hover:text-emerald-400">
        Help
      </span>

      <span class="cursor-pointer text-emerald-400">
        Profile
      </span>

    </div>

  </nav>

  <!-- SIDEBAR -->
  <div class="hidden md:flex flex-col w-52 bg-gray-800 text-white fixed top-14 left-0 h-[calc(100vh-56px)] p-4">

    <ul class="space-y-3 text-sm">

      <li onclick="goTo('dashboard')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Dashboard
      </li>

      <li onclick="goTo('challenges')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Challenges
      </li>

      <li onclick="goTo('create-challenge')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Create Challenge
      </li>

      <li onclick="goTo('leaderboard')"
      class="hover:bg-gray-700 p-2 rounded cursor-pointer">
        Leaderboard
      </li>

    </ul>

  </div>

  <!-- CONTENT -->
  <div class="flex-1">

    <div class="p-4 md:p-6 mt-16 md:ml-52">

      <h2 class="text-xl md:text-2xl font-bold mb-6">
        Trainer Profile
      </h2>

      <!-- STATUS -->
      <div id="statusBox"
      class="mb-6">
      </div>

      <!-- REUPLOAD -->
      <div id="reuploadBox"
      class="hidden bg-white p-6 rounded-xl shadow max-w-lg mb-6">

        <h3 class="font-semibold mb-4">
          Reupload Certificate
        </h3>

        <input
        id="newCertificate"
        placeholder="Paste new certificate URL"
        class="w-full border p-2 rounded mb-4">

        <button
        onclick="reuploadCertificate()"
        class="bg-emerald-500 text-white px-6 py-2 rounded">

          Submit Again

        </button>

      </div>

      <div class="bg-white p-6 rounded-xl shadow max-w-lg">

        <!-- NAME -->
        <div class="mb-4">

          <label class="text-sm text-gray-500">
            Name
          </label>

          <input
          id="name"
          disabled
          class="w-full border p-2 rounded mt-1 bg-gray-100">

        </div>

        <!-- EMAIL -->
        <div class="mb-4">

          <label class="text-sm text-gray-500">
            Email
          </label>

          <input
          id="email"
          disabled
          class="w-full border p-2 rounded mt-1 bg-gray-100">

        </div>

        <!-- SPECIALIZATION -->
        <div class="mb-4">

          <label class="text-sm text-gray-500">
            Specialization
          </label>

          <input
          id="specialization"
          disabled
          class="w-full border p-2 rounded mt-1 bg-gray-100">

        </div>

        <!-- EXPERIENCE -->
        <div class="mb-4">

          <label class="text-sm text-gray-500">
            Experience
          </label>

          <input
          id="experience"
          disabled
          class="w-full border p-2 rounded mt-1 bg-gray-100">

        </div>

        <!-- BUTTONS -->
        <!-- BUTTONS -->
<div class="flex gap-4">

  <button
  id="editBtn"
  onclick="enableEdit()" 
  class="bg-gray-500 text-white px-4 py-2 rounded">

    Edit

  </button>

  <button
  id="saveBtn"
  onclick="saveProfile()" 
  class="bg-emerald-500 text-white px-4 py-2 rounded hidden">

    Save

  </button>

  <button
  onclick="logout()"
  class="bg-red-500 text-white px-4 py-2 rounded">

    Logout

  </button>

</div>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white text-center py-4 text-xs">
    © 2026 Personal Fitness Challenge Web Platform
  </footer>

<script>

function goTo(page){
  window.location.href =
    "/trainer/" + page + "/";
}

// ENABLE EDIT
function enableEdit(){

  [
    "name",
    "email",
    "specialization",
    "experience"
  ].forEach(id => {

    document.getElementById(
      id
    ).disabled = false;

    document.getElementById(
      id
    ).classList.remove(
      "bg-gray-100"
    );
  });

  document.getElementById(
    "editBtn"
  ).classList.add("hidden");

  document.getElementById(
    "saveBtn"
  ).classList.remove("hidden");
}

// SAVE PROFILE
async function saveProfile(){

  const formData =
    new FormData();

  formData.append(
    "name",
    document.getElementById(
      "name"
    ).value
  );

  formData.append(
    "email",
    document.getElementById(
      "email"
    ).value
  );

  formData.append(
    "specialization",
    document.getElementById(
      "specialization"
    ).value
  );

  formData.append(
    "experience",
    document.getElementById(
      "experience"
    ).value
  );

  const response =
    await fetch(
      "/api/update-trainer-profile/",
      {

        method: "POST",

        body: formData,

        headers: {
          "X-CSRFToken":
          getCookie("csrftoken")
        }
      }
    );

  const data =
    await response.json();

  if(data.success){

    alert("Profile updated");

    location.reload();

  } else {

    alert(data.error);
  }
}

async function reuploadCertificate(){

  const certificate =
    document.getElementById(
      "newCertificate"
    ).value;

  if(!certificate){

    alert(
      "Please enter certificate URL"
    );

    return;
  }

  const formData =
    new FormData();

  formData.append(
    "certificate",
    certificate
  );

  const response =
    await fetch(
      "/api/reupload-certificate/",
      {

        method: "POST",

        body: formData,

        headers: {
          "X-CSRFToken":
          getCookie("csrftoken")
        }
      }
    );

  const data =
    await response.json();

  if(data.success){

    alert(
      "Certificate submitted again"
    );

    location.reload();

  } else {

    alert(data.error);
  }
}

// LOAD PROFILE
async function loadProfile(){

  const response =
    await fetch(
      "/api/trainer-profile/"
    );

  const data =
    await response.json();

  if(data.error){
    return;
  }

  document.getElementById(
    "name"
  ).value =
    data.name;

  document.getElementById(
    "email"
  ).value =
    data.email;

  document.getElementById(
    "specialization"
  ).value =
    data.specialization;

  document.getElementById(
    "experience"
  ).value =
    data.experience;

  // STATUS
  const statusBox =
    document.getElementById(
      "statusBox"
    );

  if(data.status === "approved"){

    statusBox.innerHTML = `
      <div class="bg-green-100 text-green-700 p-4 rounded">
        ✅ Your trainer account is approved
      </div>
    `;

  } else if(data.status === "rejected"){

    document.getElementById(
      "reuploadBox"
    ).classList.remove("hidden");

    statusBox.innerHTML = `
      <div class="bg-red-100 text-red-700 p-4 rounded">
        ❌ Certificate rejected. Please reupload certificate.
      </div>
    `;

  } else {

    statusBox.innerHTML = `
      <div class="bg-yellow-100 text-yellow-700 p-4 rounded">
        ⏳ Verification pending
      </div>
    `;
  }
}

// CSRF
function getCookie(name){

  let cookieValue = null;

  if(document.cookie &&
    document.cookie !== ''){

    const cookies =
      document.cookie.split(';');

    for(let i = 0;
      i < cookies.length;
      i++){

      const cookie =
        cookies[i].trim();

      if(cookie.substring(
        0,
        name.length + 1
      ) === (name + '=')){

        cookieValue =
          decodeURIComponent(
            cookie.substring(
              name.length + 1
            )
          );

        break;
      }
    }
  }

  return cookieValue;
}

loadProfile();

</script>

</body>
</html>
